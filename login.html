<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CKT Group — Sign In</title>
  <link rel="stylesheet" href="/css/portal.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">CKT Group LLC</div>
    <p class="login-subtitle">Client Portal</p>

    <!-- Step 1: email -->
    <div class="login-step active" id="step-email">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="email-input" type="email"
               placeholder="you@company.com"
               autocomplete="email">
      </div>
      <div id="email-error" class="error-msg hidden" style="margin-bottom:12px"></div>
      <button class="btn btn-primary" id="send-btn"
              onclick="sendOtp()" style="width:100%">
        Send Code
      </button>
    </div>

    <!-- Step 2: OTP -->
    <div class="login-step" id="step-otp">
      <p style="font-size:14px;color:var(--muted);margin-bottom:20px">
        A 6-digit code was sent to <strong id="display-email" style="color:var(--text)"></strong>
      </p>
      <div class="form-group">
        <label class="form-label">Verification Code</label>
        <input class="form-input" id="otp-input" type="text"
               maxlength="8" placeholder="00000000"
               autocomplete="one-time-code"
               inputmode="numeric"
               style="letter-spacing:0.2em;font-size:20px;text-align:center">
      </div>
      <div id="otp-error" class="error-msg hidden" style="margin-bottom:12px"></div>
      <button class="btn btn-primary" id="verify-btn"
              onclick="verifyOtp()" style="width:100%;margin-bottom:12px">
        Sign In
      </button>
      <button class="btn btn-secondary" onclick="backToEmail()"
              style="width:100%;font-size:13px">
        ← Use a different email
      </button>
    </div>
  </div>
</div>

<script type="module">
  import { db } from '/js/supabase-client.js';

  // Already signed in? Go to destination
  const { data: { session } } = await db.auth.getSession();
  if (session) redirect();

  const params = new URLSearchParams(window.location.search);

  function redirect() {
    const next = params.get('next');
    window.location.href = (next && next.startsWith('/')) ? next : '/index.html';
  }

  window.sendOtp = async function() {
    const email = document.getElementById('email-input').value.trim().toLowerCase();
    const errEl = document.getElementById('email-error');
    errEl.classList.add('hidden');
    if (!email || !email.includes('@')) {
      errEl.textContent = 'Enter a valid email address.';
      errEl.classList.remove('hidden');
      return;
    }
    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.textContent = 'Sending…';
    const { error } = await db.auth.signInWithOtp({ email });
    btn.disabled = false;
    btn.textContent = 'Send Code';
    if (error) {
      errEl.textContent = error.message;
      errEl.classList.remove('hidden');
      return;
    }
    document.getElementById('display-email').textContent = email;
    document.getElementById('step-email').classList.remove('active');
    document.getElementById('step-otp').classList.add('active');
    document.getElementById('otp-input').focus();
  };

  window.verifyOtp = async function() {
    const email = document.getElementById('email-input').value.trim().toLowerCase();
    const token = document.getElementById('otp-input').value.replace(/\D/g, '').trim();
    const errEl = document.getElementById('otp-error');
    errEl.classList.add('hidden');
    if (token.length !== 8) {
      errEl.textContent = 'Enter the 8-digit code.';
      errEl.classList.remove('hidden');
      return;
    }
    const btn = document.getElementById('verify-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    let { error } = await db.auth.verifyOtp({ email, token, type: 'email' });
    if (error) {
      ({ error } = await db.auth.verifyOtp({ email, token, type: 'signup' }));
    }
    btn.disabled = false;
    btn.textContent = 'Sign In';
    if (error) {
      errEl.textContent = 'Invalid or expired code. Try again.';
      errEl.classList.remove('hidden');
      return;
    }
    redirect();
  };

  window.backToEmail = function() {
    document.getElementById('step-otp').classList.remove('active');
    document.getElementById('step-email').classList.add('active');
    document.getElementById('otp-input').value = '';
  };

  // Allow Enter key on both inputs
  document.getElementById('email-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.sendOtp();
  });
  document.getElementById('otp-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') window.verifyOtp();
  });
</script>
</body>
</html>
